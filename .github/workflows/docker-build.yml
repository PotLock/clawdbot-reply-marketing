name: Docker build

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: docker-build.yml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only (no push). If this fails, the PR breaks container builds.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: openclaw-railway-template:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
